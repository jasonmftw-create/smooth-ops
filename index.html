<!doctype html>
<html lang="en">
  <head>
<script data-smoothops-localdb>
/* SMOOTH-OPS standalone data layer.
 * localStorage-backed re-implementation of the work-hub server actions,
 * so the real SMOOTH-OPS frontend bundle runs with zero server.
 * Response shapes match the server's zod schemas exactly (snake_case).
 */
(function () {
  'use strict';

  var DB_KEY = 'smoothops_db_v1';
  var DEFAULT_STORES = [];
  var DEFAULT_DISPLAY_NAME = null;
  var HOME_CARDS = ['activity', 'timecard', 'mileage', 'followups', 'recent_visits'];

  /* ---------------- storage ---------------- */
  var memFallback = {};
  function lsGet(k) {
    try { return window.localStorage.getItem(k); }
    catch (e) { return Object.prototype.hasOwnProperty.call(memFallback, k) ? memFallback[k] : null; }
  }
  function lsSet(k, v) {
    try { window.localStorage.setItem(k, v); }
    catch (e) { memFallback[k] = v; }
  }
  function defaultDb() {
    return {
      seq: { stores: 1, quick_links: 1, journal: 1, notes: 1, visits: 1, photos: 1, gm_notes: 1, metrics: 1, pipeline: 1, checklist_templates: 1, checklist_items: 1, checklist_runs: 1, checklist_run_items: 1, follow_ups: 1, mileage: 1, timecards: 1 },
      stores: [],
      quick_links: [],
      settings: { id: 1, boss_email: null, display_name: DEFAULT_DISPLAY_NAME, home_card_order: null, home_card_visibility: null },
      journal: [], notes: [], visits: [], photos: [], gm_notes: [], metrics: [], pipeline: [],
      checklist_templates: [], checklist_items: [], checklist_runs: [], checklist_run_items: [],
      follow_ups: [], mileage: [], timecards: []
    };
  }
  function loadDb() {
    try {
      var raw = lsGet(DB_KEY);
      if (raw) {
        var db = JSON.parse(raw);
        if (db && db.seq && Array.isArray(db.stores)) return db;
      }
    } catch (e) { /* corrupted -> start fresh */ }
    return defaultDb();
  }
  function saveDb(db) {
    try { lsSet(DB_KEY, JSON.stringify(db)); } catch (e) { /* quota: keep in-memory copy */ }
  }
  function nextId(db, table) {
    var id = db.seq[table] || 1;
    db.seq[table] = id + 1;
    return id;
  }
  function nowIso() { return new Date().toISOString(); }

  /* ---------------- helpers (mirror server) ---------------- */
  function parseHomeOrder(value) {
    try {
      var parsed = JSON.parse(value == null ? '[]' : value);
      if (Array.isArray(parsed)) {
        var valid = parsed.filter(function (i) { return typeof i === 'string' && HOME_CARDS.indexOf(i) >= 0; });
        if (valid.indexOf('timecard') < 0) {
          var mi = valid.indexOf('mileage');
          valid.splice(mi < 0 ? valid.length : mi, 0, 'timecard');
        }
        var out = valid.slice();
        HOME_CARDS.forEach(function (c) { if (out.indexOf(c) < 0) out.push(c); });
        return out;
      }
    } catch (e) {}
    return HOME_CARDS.slice();
  }
  function parseHomeVisibility(value) {
    var vis = { activity: true, followups: true, timecard: true, mileage: true, recent_visits: true };
    try {
      var parsed = JSON.parse(value == null ? '{}' : value);
      if (parsed && typeof parsed === 'object') {
        HOME_CARDS.forEach(function (c) { vis[c] = parsed[c] !== false; });
      }
    } catch (e) {}
    return vis;
  }
  function parseStoreIds(value, fallback) {
    try {
      var parsed = JSON.parse(value == null ? '[]' : value);
      if (Array.isArray(parsed)) {
        var ids = parsed.filter(function (i) { return typeof i === 'number' && isFinite(i) && Math.floor(i) === i && i > 0; });
        if (ids.length) {
          var seen = {}, out = [];
          ids.forEach(function (i) { if (!seen[i]) { seen[i] = 1; out.push(i); } });
          return out;
        }
      }
    } catch (e) {}
    return [fallback];
  }
  function clockMinutes(v) {
    var p = String(v).split(':');
    return Number(p[0]) * 60 + Number(p[1] || '0');
  }
  function timecardDurations(st, en, bs, be) {
    if (!st && !en && !bs && !be) return { grossMinutes: 0, breakMinutes: 0, paidMinutes: 0 };
    if (!st || !en) return null;
    var start = clockMinutes(st), end = clockMinutes(en);
    if (end <= start) end += 1440;
    var breakMinutes = 0;
    if (bs && be) {
      var bS = clockMinutes(bs);
      if (bS < start) bS += 1440;
      var bE = clockMinutes(be);
      while (bE <= bS) bE += 1440;
      if (bS < start || bE > end) return null;
      breakMinutes = bE - bS;
    }
    var gross = end - start;
    if (gross <= 0 || gross > 1440 || breakMinutes >= gross) return null;
    return { grossMinutes: gross, breakMinutes: breakMinutes, paidMinutes: gross - breakMinutes };
  }
  function byIdDesc(a, b) { return b.id - a.id; }

  /* ---------------- dashboard ---------------- */
  function getDashboard(db) {
    // Mirror the server: visits stuck in "pending" with no email task fail.
    db.visits.forEach(function (v) {
      if (v.email_status === 'pending' && !v.email_task_id) {
        v.email_status = 'failed';
        v.email_error = 'The email job did not start. Check the Outlook connection and try again.';
      }
    });

    var stores = db.stores.filter(function (s) { return s.active !== false; })
      .sort(function (a, b) { return (a.sort_order - b.sort_order) || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
    var quickLinks = db.quick_links.slice()
      .sort(function (a, b) { return (a.sort_order - b.sort_order) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0); });
    var settings = db.settings || defaultDb().settings;

    function latest(arr, n) { return arr.slice().sort(byIdDesc).slice(0, n); }

    return {
      stores: stores.map(function (s) {
        return { id: s.id, name: s.name, gm_name: s.gm_name ?? null, gm_email: s.gm_email ?? null, gm_phone: s.gm_phone ?? null, agm_name: s.agm_name ?? null, agm_email: s.agm_email ?? null, agm_phone: s.agm_phone ?? null, sort_order: s.sort_order };
      }),
      quick_links: quickLinks.map(function (l) { return { id: l.id, label: l.label, url: l.url, sort_order: l.sort_order }; }),
      settings: {
        boss_email: settings.boss_email ?? null,
        display_name: settings.display_name ?? null,
        home_card_order: parseHomeOrder(settings.home_card_order),
        home_card_visibility: parseHomeVisibility(settings.home_card_visibility)
      },
      journal: db.journal.slice().sort(function (a, b) { return (a.happened_at < b.happened_at ? 1 : a.happened_at > b.happened_at ? -1 : 0) || (b.id - a.id); }).slice(0, 100)
        .map(function (j) { return { id: j.id, kind: j.kind, body: j.body, happened_at: j.happened_at }; }),
      notes: db.notes.slice().sort(function (a, b) { return (a.updated_at < b.updated_at ? 1 : a.updated_at > b.updated_at ? -1 : 0) || (b.id - a.id); }).slice(0, 100)
        .map(function (n) { return { id: n.id, kind: n.kind, title: n.title, body: n.body, updated_at: n.updated_at }; }),
      visits: db.visits.slice().sort(function (a, b) { return (a.visit_date < b.visit_date ? 1 : a.visit_date > b.visit_date ? -1 : 0) || (b.id - a.id); }).slice(0, 100)
        .map(function (v) { return { id: v.id, store_id: v.store_id, visit_date: v.visit_date, summary: v.summary, feedback: v.feedback, email_status: v.email_status, email_sent_at: v.email_sent_at ?? null, email_error: v.email_error ?? null, created_at: v.created_at }; }),
      photos: latest(db.photos, 200)
        .map(function (p) { return { id: p.id, visit_id: p.visit_id, url: p.url, caption: p.caption ?? null }; }),
      gm_notes: latest(db.gm_notes, 100)
        .map(function (n) { return { id: n.id, store_id: n.store_id, leader_role: n.leader_role, note_type: n.note_type, body: n.body, created_at: n.created_at }; }),
      metrics: latest(db.metrics, 100)
        .map(function (m) { return { id: m.id, store_id: m.store_id, period_label: m.period_label, sales: m.sales ?? null, osat: m.osat ?? null, labor: m.labor ?? null, cogs: m.cogs ?? null, weather: m.weather ?? null, created_at: m.created_at }; }),
      pipeline: latest(db.pipeline, 100)
        .map(function (p) { return { id: p.id, store_id: p.store_id, name: p.name, role: p.role, readiness: p.readiness, note: p.note ?? null, created_at: p.created_at }; }),
      checklist_templates: latest(db.checklist_templates, 100).map(function (t) {
        return {
          id: t.id, store_id: t.store_id, name: t.name,
          items: db.checklist_items.filter(function (i) { return i.template_id === t.id; })
            .sort(function (a, b) { return a.sort_order - b.sort_order; })
            .map(function (i) { return { id: i.id, label: i.label, sort_order: i.sort_order }; })
        };
      }),
      checklist_runs: latest(db.checklist_runs, 100).map(function (r) {
        return {
          id: r.id, template_id: r.template_id, store_id: r.store_id, run_date: r.run_date,
          run_time: r.run_time ?? null, manager_on_duty: r.manager_on_duty ?? null,
          summary_note: r.summary_note ?? null, completed_at: r.completed_at ?? null,
          items: db.checklist_run_items.filter(function (i) { return i.run_id === r.id; })
            .sort(function (a, b) { return a.sort_order - b.sort_order; })
            .map(function (i) { return { id: i.id, label: i.label, checked: !!i.checked, observation: i.observation ?? null, sort_order: i.sort_order }; })
        };
      }),
      follow_ups: db.follow_ups.slice().sort(function (a, b) {
        return (a.status < b.status ? -1 : a.status > b.status ? 1 : 0) ||
          (a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0) ||
          (b.id - a.id);
      }).slice(0, 200).map(function (f) {
        return { id: f.id, store_id: f.store_id ?? null, title: f.title, notes: f.notes ?? null, due_date: f.due_date, reminder_at: f.reminder_at ?? null, status: f.status, created_at: f.created_at };
      }),
      mileage: db.mileage.slice().sort(function (a, b) { return (a.drive_date < b.drive_date ? 1 : a.drive_date > b.drive_date ? -1 : 0) || (b.id - a.id); }).slice(0, 500)
        .map(function (m) { return { id: m.id, drive_date: m.drive_date, from_location: m.from_location, to_location: m.to_location, miles: m.miles, note: m.note ?? null, created_at: m.created_at }; }),
      timecards: db.timecards.slice().sort(function (a, b) { return (a.work_date < b.work_date ? 1 : a.work_date > b.work_date ? -1 : 0) || (b.id - a.id); }).slice(0, 500)
        .map(function (t) {
          return {
            id: t.id, work_date: t.work_date, store_id: t.store_id, store_ids: parseStoreIds(t.store_ids, t.store_id),
            hours: t.hours, gross_hours: t.gross_hours ?? t.hours,
            paid_break_minutes: t.paid_break_minutes || 0, unpaid_break_minutes: t.unpaid_break_minutes || 0,
            start_time: t.start_time ?? null, end_time: t.end_time ?? null,
            break_start_time: t.break_start_time ?? null, break_end_time: t.break_end_time ?? null,
            sick_hours: t.sick_hours || 0, vacation_hours: t.vacation_hours || 0, holiday_hours: t.holiday_hours || 0,
            note: t.note ?? null, created_at: t.created_at
          };
        })
    };
  }

  /* ---------------- actions ---------------- */
  var Actions = {
    bootstrap: function (db) {
      var created = 0;
      if (db.stores.length === 0) {
        DEFAULT_STORES.forEach(function (name, i) {
          db.stores.push({ id: nextId(db, 'stores'), name: name, gm_name: null, gm_email: null, gm_phone: null, agm_name: null, agm_email: null, agm_phone: null, sort_order: i, active: true });
        });
        created = DEFAULT_STORES.length;
      }
      return { created: created };
    },

    getDashboard: function (db) { return getDashboard(db); },

    addJournal: function (db, a) {
      var id = nextId(db, 'journal');
      db.journal.push({ id: id, kind: a.kind, body: a.body, happened_at: a.happened_at });
      return { id: id };
    },

    addNote: function (db, a) {
      var id = nextId(db, 'notes');
      db.notes.push({ id: id, kind: a.kind, title: a.title, body: a.body, updated_at: nowIso() });
      return { id: id };
    },

    saveStore: function (db, a) {
      if (a.id) {
        var s = db.stores.find(function (x) { return x.id === a.id; });
        if (!s) throw new Error('Store not found.');
        s.name = a.name; s.gm_name = a.gm_name ?? null; s.gm_email = a.gm_email ?? null; s.gm_phone = a.gm_phone ?? null;
        s.agm_name = a.agm_name ?? null; s.agm_email = a.agm_email ?? null; s.agm_phone = a.agm_phone ?? null;
        return { id: a.id };
      }
      var id = nextId(db, 'stores');
      db.stores.push({ id: id, name: a.name, gm_name: a.gm_name ?? null, gm_email: a.gm_email ?? null, gm_phone: a.gm_phone ?? null, agm_name: a.agm_name ?? null, agm_email: a.agm_email ?? null, agm_phone: a.agm_phone ?? null, sort_order: 99, active: true });
      return { id: id };
    },

    saveQuickLink: function (db, a) {
      if (a.id) {
        var l = db.quick_links.find(function (x) { return x.id === a.id; });
        if (!l) throw new Error('Link not found.');
        l.label = a.label; l.url = a.url;
        return { id: a.id };
      }
      var id = nextId(db, 'quick_links');
      db.quick_links.push({ id: id, label: a.label, url: a.url, sort_order: 99 });
      return { id: id };
    },

    deleteQuickLink: function (db, a) {
      db.quick_links = db.quick_links.filter(function (x) { return x.id !== a.id; });
      return { ok: true };
    },

    deleteStore: function (db, a) {
      db.stores = db.stores.filter(function (x) { return x.id !== a.id; });
      return { ok: true };
    },

    saveSettings: function (db, a) {
      db.settings.boss_email = a.boss_email ?? null;
      return { ok: true };
    },

    saveDisplayName: function (db, a) {
      db.settings.display_name = a.display_name ?? null;
      return { ok: true };
    },

    addVisit: function (db, a) {
      var id = nextId(db, 'visits');
      db.visits.push({ id: id, store_id: a.store_id, visit_date: a.visit_date, summary: a.summary, feedback: a.feedback, email_status: 'not_sent', email_sent_at: null, email_error: null, email_task_id: null, created_at: nowIso() });
      return { id: id };
    },

    uploadVisitPhoto: function (db, a) {
      if (!a.data_base64 || a.data_base64.length > 13500000) throw new Error('Photo is too large. Choose an image under 10 MB.');
      var id = nextId(db, 'photos');
      db.photos.push({ id: id, visit_id: a.visit_id, url: 'data:' + a.mime_type + ';base64,' + a.data_base64, caption: a.caption ?? null });
      return { id: id };
    },

    addGmNote: function (db, a) {
      var id = nextId(db, 'gm_notes');
      db.gm_notes.push({ id: id, store_id: a.store_id, leader_role: a.leader_role || 'gm', note_type: a.note_type, body: a.body, created_at: nowIso() });
      return { id: id };
    },

    addMetric: function (db, a) {
      var existing = db.metrics.filter(function (m) { return m.store_id === a.store_id && m.period_label === a.period_label; })
        .sort(byIdDesc)[0];
      var values = { sales: a.sales ?? null, osat: a.osat ?? null, labor: a.labor ?? null, cogs: a.cogs ?? null, weather: a.weather ?? null };
      if (existing) {
        existing.sales = values.sales; existing.osat = values.osat; existing.labor = values.labor; existing.cogs = values.cogs; existing.weather = values.weather;
        return { id: existing.id };
      }
      var id = nextId(db, 'metrics');
      db.metrics.push({ id: id, store_id: a.store_id, period_label: a.period_label, sales: values.sales, osat: values.osat, labor: values.labor, cogs: values.cogs, weather: values.weather, created_at: nowIso() });
      return { id: id };
    },

    addPipelineMember: function (db, a) {
      var id = nextId(db, 'pipeline');
      db.pipeline.push({ id: id, store_id: a.store_id, name: a.name, role: a.role, readiness: a.readiness, note: a.note ?? null, created_at: nowIso() });
      return { id: id };
    },

    saveHomeLayout: function (db, a) {
      db.settings.home_card_order = JSON.stringify(a.order);
      db.settings.home_card_visibility = JSON.stringify(a.visibility);
      return { ok: true };
    },

    createChecklistTemplate: function (db, a) {
      var anchor = db.stores.filter(function (s) { return s.active !== false; })
        .sort(function (x, y) { return x.sort_order - y.sort_order; })[0];
      if (!anchor) return { id: 0 };
      var id = nextId(db, 'checklist_templates');
      db.checklist_templates.push({ id: id, store_id: anchor.id, name: a.name });
      (a.items || []).forEach(function (label, i) {
        db.checklist_items.push({ id: nextId(db, 'checklist_items'), template_id: id, label: label, sort_order: i });
      });
      return { id: id };
    },

    updateChecklistTemplate: function (db, a) {
      var t = db.checklist_templates.find(function (x) { return x.id === a.id; });
      if (!t) throw new Error('Checklist not found.');
      t.name = a.name;
      db.checklist_items = db.checklist_items.filter(function (i) { return i.template_id !== a.id; });
      (a.items || []).forEach(function (label, i) {
        db.checklist_items.push({ id: nextId(db, 'checklist_items'), template_id: a.id, label: label, sort_order: i });
      });
      return { ok: true };
    },

    startChecklistRun: function (db, a) {
      var t = db.checklist_templates.find(function (x) { return x.id === a.template_id; });
      if (!t) return { id: 0 };
      var items = db.checklist_items.filter(function (i) { return i.template_id === a.template_id; })
        .sort(function (x, y) { return x.sort_order - y.sort_order; });
      var id = nextId(db, 'checklist_runs');
      db.checklist_runs.push({ id: id, template_id: t.id, store_id: a.store_id, run_date: a.run_date, run_time: a.run_time ?? null, manager_on_duty: a.manager_on_duty ?? null, summary_note: null, completed_at: null });
      items.forEach(function (item) {
        db.checklist_run_items.push({ id: nextId(db, 'checklist_run_items'), run_id: id, label: item.label, checked: false, observation: null, sort_order: item.sort_order });
      });
      return { id: id };
    },

    toggleChecklistItem: function (db, a) {
      var item = db.checklist_run_items.find(function (x) { return x.id === a.id; });
      if (!item) throw new Error('Checklist item not found.');
      item.checked = !!a.checked;
      var run = db.checklist_runs.find(function (r) { return r.id === item.run_id; });
      if (run) {
        var all = db.checklist_run_items.filter(function (i) { return i.run_id === run.id; });
        run.completed_at = (all.length > 0 && all.every(function (i) { return i.checked; })) ? nowIso() : null;
      }
      return { ok: true };
    },

    saveChecklistObservation: function (db, a) {
      var item = db.checklist_run_items.find(function (x) { return x.id === a.id; });
      if (!item) throw new Error('Checklist item not found.');
      item.observation = a.observation ?? null;
      return { ok: true };
    },

    saveChecklistSummary: function (db, a) {
      var run = db.checklist_runs.find(function (r) { return r.id === a.run_id; });
      if (!run) throw new Error('Checklist run not found.');
      run.summary_note = a.summary_note ?? null;
      return { ok: true };
    },

    deleteChecklistTemplate: function (db, a) {
      db.checklist_templates = db.checklist_templates.filter(function (t) { return t.id !== a.id; });
      db.checklist_items = db.checklist_items.filter(function (i) { return i.template_id !== a.id; });
      return { ok: true };
    },

    addFollowUp: function (db, a) {
      var id = nextId(db, 'follow_ups');
      db.follow_ups.push({ id: id, store_id: a.store_id ?? null, title: a.title, notes: a.notes ?? null, due_date: a.due_date, reminder_at: a.reminder_at ?? null, status: 'open', created_at: nowIso() });
      return { id: id };
    },

    setFollowUpStatus: function (db, a) {
      var f = db.follow_ups.find(function (x) { return x.id === a.id; });
      if (!f) throw new Error('Follow-up not found.');
      f.status = a.status;
      return { ok: true };
    },

    deleteFollowUp: function (db, a) {
      db.follow_ups = db.follow_ups.filter(function (x) { return x.id !== a.id; });
      return { ok: true };
    },

    addMileage: function (db, a) {
      var id = nextId(db, 'mileage');
      db.mileage.push({ id: id, drive_date: a.drive_date, from_location: a.from_location, to_location: a.to_location, miles: a.miles, note: a.note ?? null, created_at: nowIso() });
      return { id: id };
    },

    deleteMileage: function (db, a) {
      db.mileage = db.mileage.filter(function (x) { return x.id !== a.id; });
      return { ok: true };
    },

    addTimecard: function (db, a) {
      if (Boolean(a.start_time) !== Boolean(a.end_time)) throw new Error('Enter both shift times or leave both blank.');
      if (Boolean(a.break_start_time) !== Boolean(a.break_end_time)) throw new Error('Enter both break times or leave both blank.');
      var durations = timecardDurations(a.start_time || null, a.end_time || null, a.break_start_time || null, a.break_end_time || null);
      if (!durations) throw new Error('Break times must fall within the shift, and the shift must be 24 hours or less.');
      var paidMinutes = durations.paidMinutes + ((a.sick_hours || 0) + (a.vacation_hours || 0) + (a.holiday_hours || 0)) * 60;
      if (paidMinutes <= 0) throw new Error('Enter shift times or paid hours.');
      var storeIds = [];
      (a.store_ids || []).forEach(function (id) { if (storeIds.indexOf(id) < 0) storeIds.push(id); });
      var paidHours = Math.round((durations.paidMinutes / 60) * 100) / 100;
      var grossHours = Math.round((durations.grossMinutes / 60) * 100) / 100;
      var id = nextId(db, 'timecards');
      db.timecards.push({
        id: id, work_date: a.work_date, store_id: storeIds[0] || 0, store_ids: JSON.stringify(storeIds),
        hours: paidHours, gross_hours: grossHours, paid_break_minutes: 0, unpaid_break_minutes: durations.breakMinutes,
        start_time: a.start_time || null, end_time: a.end_time || null,
        break_start_time: a.break_start_time || null, break_end_time: a.break_end_time || null,
        sick_hours: a.sick_hours || 0, vacation_hours: a.vacation_hours || 0, holiday_hours: a.holiday_hours || 0,
